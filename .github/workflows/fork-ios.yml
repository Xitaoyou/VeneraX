name: Fork iOS
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 'Sync upstream before building'
        type: boolean
        default: true
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: fork-ios
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master
      - name: Verify IPA build filter
        run: |
          python3 .github/fork/test_should_build.py
          python3 .github/fork/test_sync_upstream.py
          python3 .github/fork/test_release_notes.py
      - id: source
        shell: bash
        env:
          SYNC_UPSTREAM: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_upstream) }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          if [ "$SYNC_UPSTREAM" = true ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git fetch https://github.com/Kyosee/VeneraX.git master
            python3 .github/fork/sync_upstream.py FETCH_HEAD
            git push origin HEAD:master
          fi
          after=$(git rev-parse HEAD)
          echo "sha=$after" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = push ]; then
            before=$PUSH_BEFORE
          elif [ "$EVENT_NAME" = schedule ]; then
            # Compare against the published app, not just this run's merge.
            # Failed builds are retried even when upstream has not changed.
            published_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            before=$(git rev-parse --verify "${published_tag}^{commit}" 2>/dev/null || true)
            before=${before:-0000000000000000000000000000000000000000}
          fi
          force=()
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            force=(--force)
          fi
          build=$(python3 .github/fork/should_build.py --base "$before" --head "$after" "${force[@]}")
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [ "$build" = true ]; then
            # Keep a branch ref on the exact build SHA until publication.
            # A later master push must not invalidate release creation when
            # this commit changes workflow files (GitHub workflow-scope rule).
            git push origin HEAD:refs/heads/codex/ios-build
          fi

  build:
    needs: source
    if: needs.source.outputs.build == 'true'
    # Explicit Intel pool avoids the macOS ARM capacity queue. Flutter is x64.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pubspec's Flutter requirement is a range, not an installable SDK.
          # Keep the tested toolchain explicit; pub get checks compatibility.
          flutter-version: '3.44.3'
          architecture: x64
          cache: true
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
      - name: Analyze changed integration points
        run: >-
          flutter analyze --no-pub
          lib/foundation/image_surface_route.dart
          lib/components/pull_down_to_dismiss.dart
          lib/components/swipe_action.dart
          lib/foundation/fork_release_version.dart
          lib/pages/reader/reader.dart
          lib/pages/comic_details_page/comic_page.dart
          lib/pages/image_favorites_page/image_favorites_page.dart
          lib/pages/settings/settings_page.dart
          test/image_surface_route_test.dart
          test/pull_down_to_dismiss_test.dart
          test/reader_pull_down_integration_test.dart
          test/fork_release_version_test.dart
      - name: Gesture and update regressions
        run: >-
          flutter test
          test/image_surface_route_test.dart
          test/pull_down_to_dismiss_test.dart
          test/reader_pull_down_integration_test.dart
          test/fork_release_version_test.dart
          test/ios_back_swipe_zoomed_image_test.dart
          test/fork_comic_tile_back_test.dart
          test/fork_release_notes_test.dart
          test/app_update_changelog_test.dart
          test/app_update_dialog_test.dart
      - name: Verify update feed metadata
        run: python3 .github/fork/test_feed.py
      - name: Build unsigned iOS app
        env:
          FORK_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          version=${version%%+*}
          build=$((10000 + FORK_BUILD))
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD=$build" >> "$GITHUB_ENV"
          echo "TAG=v$version+$build" >> "$GITHUB_ENV"
          flutter build ios --release --no-codesign --build-name="$version" --build-number="$build"
          mkdir -p result/Payload
          cp -R build/ios/iphoneos/Runner.app result/Payload/
          cd result
          zip -qr "VeneraX-ios-$version+$build.ipa" Payload
          shasum -a 256 *.ipa > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: fork-ios
          path: |
            result/*.ipa
            result/SHA256SUMS
          if-no-files-found: error
      - name: Publish only verified fork build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PREVIOUS_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          python3 .github/fork/make_release_notes.py
          python3 .github/fork/make_feed.py
          gh release create "$TAG" result/*.ipa result/SHA256SUMS result/altstore-source.json result/release-notes.md \
            --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --latest \
            --title "VeneraX $VERSION · personal iOS build $BUILD" \
            --notes-file result/release-notes.md
