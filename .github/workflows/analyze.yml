name: "analyze"
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: '3.44.3'
          architecture: x64
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare original ImageTrans Legacy model
        run: |
          python -m pip install numpy==2.2.6 onnx==1.19.1
          python tool/convert_legacy_balloon.py
      - run: flutter pub get
      - uses: invertase/github-action-dart-analyzer@v3
